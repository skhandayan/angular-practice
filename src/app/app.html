<div class="user-details-form">
  <h2>User Details</h2>
  <br>
  <input [(ngModel)]="name" placeholder="Name">
  <br>
  <input type="email" [(ngModel)]="email" placeholder="E-Mail">
  <br>
  <textarea [(ngModel)]="address" class="address-textarea" placeholder="Address"></textarea>
  <br>
  <button (click)="saveNewData()">Save Data</button>
</div>


@if( userDetailsArray.length > 0) {
  <div>
    <div class="user-data-table">
      <table width="500">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Address</th>
            <th>Action</th>
          </tr>
        </thead>
        
        <tbody>
          @for (user of userDetailsArray; track user; let index = $index) {
            <tr>
              <td class="user-info">{{ index + 1}}</td>
              <td class="user-info">{{ user.name}}</td>
              <td class="user-info">{{ user.email}}</td>
              <td class="user-info">{{ user.address}}</td>
              <td class="user-info"><button (click)="removeItem(index)">Delete</button></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
} @else {
  <h5 class="user-data-table">No data shown</h5>
}
